<div class="home-page-wrapper">
  <app-navbar></app-navbar>

  <main class="home-main">
    <div class="carousel-container">
      <div id="withIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">

        <!-- Indicators -->
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#withIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#withIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#withIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
          <button type="button" data-bs-target="#withIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
        </div>

        <!-- Slides -->
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="assets/img/slider1.jpeg" class="d-block w-100 carousel-slide-img" alt="Slide 1">
          </div>
          <div class="carousel-item">
            <img src="assets/img/slider2.jpg" class="d-block w-100 carousel-slide-img" alt="Slide 2">
          </div>
          <div class="carousel-item">
            <img src="assets/img/slider3.jpg" class="d-block w-100 carousel-slide-img" alt="Slide 3">
          </div>
          <div class="carousel-item">
            <img src="assets/img/slider4.jpg" class="d-block w-100 carousel-slide-img" alt="Slide 4">
          </div>
        </div>

        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#withIndicators" data-bs-slide="prev">
          <span class="carousel-control-prev-icon carasouel-btn" aria-hidden="true"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#withIndicators" data-bs-slide="next">
          <span class="carousel-control-next-icon carasouel-btn" aria-hidden="true"></span>
        </button>

      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
