<mat-nav-list class="custom-sidenav">

  <a mat-list-item [routerLink]="['/administrator']">
    <mat-icon style="font-size: 1.15rem;height: auto;">dashboard</mat-icon>
    <span class="ms-1">Dashboard</span>
  </a>

  <!-- Master Data Entry with dropdown -->
  <div class="submenu">
    <a mat-list-item (click)="toggleMasterData()" class="submenu-header">
      <mat-icon style="font-size: 1.15rem;height: auto;">layers</mat-icon>
      <span class="ms-1">Master Data Entry</span>
      <mat-icon class="expand-icon">{{ showMasterData ? 'expand_less' : 'expand_more' }}</mat-icon>
    </a>

    <div *ngIf="showMasterData" class="submenu-items">

      <a mat-list-item [routerLink]="['/administrator/master-data/organization']">
        <span>Organization</span>
      </a>
      <a mat-list-item [routerLink]="['/administrator/master-data/offices']">
        <span>Offices</span>
      </a>
      <a mat-list-item [routerLink]="['/administrator/master-data/office-type']">
        <span>Office Type</span>
      </a>
      <a mat-list-item [routerLink]="['/administrator/master-data/designation']">
        <span>Designation</span>
      </a>
      <a mat-list-item [routerLink]="['/administrator/master-data/category']">
        <span>Category</span>
      </a>
      <a mat-list-item [routerLink]="['/administrator/master-data/sub-category']">
        <span>Sub-Category</span>
      </a>
      <a mat-list-item [routerLink]="['/administrator/master-data/manage-user']">
        <span>User</span>
      </a>
      <a mat-list-item [routerLink]="['/administrator/master-data/role']">
        <span>Role</span>
      </a>
    </div>
  </div>

  <a mat-list-item [routerLink]="['/administrator/master-report']">
    <mat-icon style="font-size: 1.15rem;height: auto;">assignment</mat-icon>
    <span class="ms-1">Reports</span>
  </a>

  <a mat-list-item [routerLink]="['/administrator/settings']">
    <mat-icon style="font-size: 1.15rem;height: auto;">settings</mat-icon>
    <span class="ms-1">Settings</span>
  </a>

</mat-nav-list>
