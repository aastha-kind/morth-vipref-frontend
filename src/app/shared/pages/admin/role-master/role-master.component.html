<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2><b>Manage Roles</b></h2>

    <div class="d-flex align-items-center gap-3">
      <mat-form-field appearance="outline" class="me-3" style="width: 250px;margin-top:18px;">
        <input matInput (keyup)="applyFilter($event)" placeholder="Search Role Name" />
      </mat-form-field>

      <button mat-raised-button color="accent" (click)="openAddDialog()">
        <mat-icon>add</mat-icon> Add Role
      </button>
    </div>
  </div>

  <table mat-table [dataSource]="roles" class="mat-elevation-z2 w-100">

    <ng-container matColumnDef="srNo">
      <th mat-header-cell *matHeaderCellDef class="text-center">Sr. No.</th>
      <td mat-cell *matCellDef="let role; let i = index" class="text-center">{{ i + 1 }}</td>
    </ng-container>

    <ng-container matColumnDef="roleName">
      <th mat-header-cell *matHeaderCellDef class="text-center">Role Name</th>
      <td mat-cell *matCellDef="let role" class="text-center">{{ role.roleName }}</td>
    </ng-container>

    <ng-container matColumnDef="roleDescription">
      <th mat-header-cell *matHeaderCellDef class="text-center">Description</th>
      <td mat-cell *matCellDef="let role" class="text-center">{{ role.roleDescription || 'NA' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-center">Actions</th>
      <td mat-cell *matCellDef="let role" class="text-center">
        <button mat-icon-button color="primary" (click)="openEditDialog(role)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="openDeleteDialog(role)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="roles.data.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons>
  </mat-paginator>
</div>
