<div class="overflow-x-auto px-4 pb-4">
    <div class="govt-title">
        <div class="title-main">DISCARDED Inbox</div>
    </div>

    <!-- Search Filter -->
    <mat-form-field class="w-full mb-4">
      <mat-label>Search by Reference Number</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Enter reference number (e.g., MH00001)">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>

    <table mat-table [dataSource]="queueReferencesData" matSort matSortActive="assignedAt" matSortDirection="desc" class="mat-elevation-z8 border">

        <!-- Reference Number Column -->
        <ng-container matColumnDef="referenceNo">
            <th mat-header-cell *matHeaderCellDef>Reference No</th>
            <td mat-cell *matCellDef="let element">{{element.referenceNo}}</td>
        </ng-container>

        <!-- Office Column -->
        <ng-container matColumnDef="office">
            <th mat-header-cell *matHeaderCellDef>Office</th>
            <td mat-cell *matCellDef="let element">
                <span *ngIf="element.initiatorOfficeType === 'MINISTRY'" class="office-badge badge-ministry">
                    Minister Office
                </span>
                <span *ngIf="element.initiatorOfficeType === 'SECRETARY'" class="office-badge badge-secretary">
                    Secretary Office
                </span>
                <span *ngIf="!element.initiatorOfficeType">-</span>
            </td>
        </ng-container>

        <!-- Subject Column -->
        <ng-container matColumnDef="subject">
            <th mat-header-cell *matHeaderCellDef>Subject</th>
            <td mat-cell *matCellDef="let element">{{element.subject}}</td>
        </ng-container>

        <!-- Received Date Column -->
        <ng-container matColumnDef="assignedAt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Received Date</th>
            <td mat-cell *matCellDef="let element">{{element.assignedAt | date:'dd MMM yyyy HH:mm:ss'}}</td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button (click)="viewReference(element)">
                    <mat-icon style="color: #3e9393;">visibility</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [colSpan]="displayedColumns.length">
                No Assignment Left.
            </td>
        </tr>

    </table>

    <mat-paginator class="mat-elevation-z1"
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
</div>
