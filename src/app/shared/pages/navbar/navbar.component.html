<!-- Top Navbar -->
<mat-toolbar class="navbar-top" color="primary">
  <!-- Left: Flag + GOVT -->
  <div class="d-flex align-items-center gap-2 cursor-pointer" (click)="navigateHome()">
    <img src="assets/img/Flag_of_India.png" alt="India Flag" class="h-6" />
    <p class="mb-0 text-white text-sm font-normal d-none d-sm-block">GOVERNMENT OF INDIA</p>
  </div>

  <!-- Spacer -->
  <span class="ms-auto"></span>

  <div class="d-flex align-items-center gap-2 gap-sm-4">
    <div class="vertical-divider d-none d-sm-block"></div>

    <!-- Accessibility Controls -->
    <div class="access-type d-flex align-items-center gap-1 gap-sm-2 text-white">
      <a href="javascript:void(0)" class="changer" title="Decrease Text" (click)="reduceFontSize()">
        <sup>-</sup>A
      </a>
      <a href="javascript:void(0)" class="changer" title="Reset Text" (click)="resetFontSize()">
        A
      </a>
      <a href="javascript:void(0)" class="changer" title="Increase Text" (click)="increaseFontSize()">
        <sup>+</sup>A
      </a>
    </div>
  </div>
</mat-toolbar>

<!-- Menu Navbar -->
<mat-toolbar class="navbar-menu">
  <div class="d-flex align-items-center gap-2 navbar-brand-section">
    <img src="assets/img/Emblem_of_India.svg" alt="India Emblem" class="navbar-emblem" />
    <div class="brand-divider d-none d-sm-block"></div>
    <div class="d-grid navbar-title-section">
      <span class="font-bold text-blue-900 navbar-title">VIP Reference Management</span>
      <p class="mb-0 text-sm text-gray-800 font-normal navbar-subtitle d-none d-md-block">Ministry of Road Transport and Highways, Government of India</p>
    </div>
  </div>

  <span class="ms-auto"></span>

  <div class="d-flex align-items-center gap-2">
    <!-- Login -->
    <button mat-raised-button color="primary" class="login-button" *ngIf="isLoginedButton" (click)="userLogin()">
      <mat-icon>person</mat-icon><span class="btn-label d-none d-sm-inline">&nbsp;Login</span>
    </button>

    <!-- Home -->
    <button mat-raised-button color="accent" class="login-button text-white" *ngIf="isHomeButton" [routerLink]="['/']">
      <mat-icon>home</mat-icon><span class="btn-label d-none d-sm-inline">&nbsp;Home</span>
    </button>
  </div>
</mat-toolbar>
